services:
  backend:
    build: .
    env_file: ./backend/.env
    environment:
      ENVIRONMENT: production
      DATA_DIR: /app/backend/uploads
      STORAGE_CONFIG_FILE: /app/backend/uploads/.storage-settings.json
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ai_interview_platform
    ports: ["8010:8010"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes: ["mianmian_uploads:/app/backend/uploads"]
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mianmian_pg
    environment:
      POSTGRES_DB: ai_interview_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_interview_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: mianmian_redis
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
volumes:
  pgdata:
  redisdata:
  mianmian_uploads:
